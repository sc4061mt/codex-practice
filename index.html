<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090e1b">
  <title>めぐる — ルーレットで決めよう</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header><a class="brand" href="./" aria-label="めぐる ホーム"><span class="brand-mark">◌</span> めぐる<span class="brand-en">MEGURU</span></a><span class="badge"><i></i> あとは、運まかせ</span></header>
    <section class="intro"><p class="eyebrow">A LITTLE SPIN, A NEW POSSIBILITY</p><h1>迷ったら、まわそう。</h1><p>小さな選択に、ちょっとしたワクワクを。</p></section>
    <section class="roulette-panel" aria-label="ルーレット">
      <div class="wheel-top"><span>YOUR CHOICES</span><span id="choice-count">05 OPTIONS</span></div>
      <div class="wheel-stage"><div class="pointer" aria-hidden="true"></div><div class="wheel-rim"><canvas id="wheel" width="840" height="840" role="img" aria-label="候補を色分けしたルーレット"></canvas><div class="hub" aria-hidden="true"><span>✦</span></div></div></div>
      <div class="result" role="status" aria-live="polite" aria-atomic="true"><span id="result-label">今日の選択は？</span><strong id="result">運命のひとまわし</strong></div>
      <button class="spin-button" id="spin" type="button"><span aria-hidden="true">↻</span> スタート</button>
      <p class="spin-hint">タップして、偶然にまかせよう</p>
    </section>
    <section class="choices-panel" aria-labelledby="choices-title"><div class="section-heading"><div><span class="eyebrow">MAKE IT YOURS</span><h2 id="choices-title">候補をカスタマイズ</h2></div><span id="saved" class="save-status">✓ 自動保存</span></div><p class="section-note">何を決める？ 候補は自由に編集できます。</p>
      <div id="choices"></div>
      <form id="add-form"><label class="sr-only" for="new-choice">新しい候補</label><input id="new-choice" maxlength="40" placeholder="新しい候補を入力" autocomplete="off"><button type="submit" id="add" aria-label="候補を追加">＋ 追加</button></form>
      <p id="message" class="message" role="status"></p>
    </section>
    <footer><span aria-hidden="true">✦</span> どんな結果も、新しいきっかけに。<small>MEGURU · YOUR EVERYDAY DECISION MAKER</small></footer>
  </main>
</body>
</html>
